name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# This explicitly tells GitHub to allow this script to push code
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4 to fix the Node.js warning
      - uses: actions/checkout@v4

      - name: Generate the Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ANISHYADAV19
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Updated to v4 to fix the Exit Code 128 error
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
